<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tycoon India | Auth</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="brand">
    <h1>Tycoon India</h1>
    <p>Your Growth Our Mission</p>
  </div>

  <div class="auth-card">
    <h2>Welcome</h2>
    <p class="sub">Sign in to your account or create a new one</p>

    <div class="tabs">
      <button id="signinTab" type="button" class="active">Sign In</button>
      <button id="signupTab" type="button">Sign Up</button>
   </div>

    <form id="authForm">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" required />

      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" required />

      <button type="submit" id="submitBtn">Sign In</button>
    </form>
  </div>

  <!-- ✅ SUPABASE FIRST -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- ✅ YOUR JS AFTER -->
  <script src="auth.js"></script>
</body>
</html>
